services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wuyin-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./server/database.sqlite:/app/database.sqlite
      - ./server/public/uploads:/app/public/uploads
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: wuyin-web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./src/证书:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
